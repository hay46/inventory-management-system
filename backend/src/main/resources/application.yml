server:
  port: 8080

spring:
  application:
    name: iams-backend
  datasource:
    url: jdbc:h2:mem:iamsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

iams:
  jwt:
    secret: ${JWT_SECRET:iams-dev-secret-key-change-in-production-please-use-32-chars-min}
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:*,http://127.0.0.1:*

logging:
  level:
    com.injibara.iams: DEBUG
    org.springframework.security: INFO
